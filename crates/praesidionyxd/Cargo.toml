[package]
name = "praesidionyxd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
praesidionyx-memory = { path = "../praesidionyx-memory" }
rmcp = { version = "3.5", features = ["client", "transport-io", "transport-async-rw"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util.workspace = true
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
url = "2"

praesidionyx-caps = { path = "../praesidionyx-caps" }
praesidionyx-policy = { path = "../praesidionyx-policy" }
praesidionyx-audit = { path = "../praesidionyx-audit" }
fs2 = "0.4"
praesidionyx-sandbox = { path = "../praesidionyx-sandbox" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
prost.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
hyper-util.workspace = true
